name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m unittest discover -s tests -t .

  end-to-end:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v5
      - name: Start Trino, Iceberg REST catalog and object storage
        run: docker compose up -d --wait trino
      - name: Build the warehouse on synthetic events and run data quality checks
        run: docker compose run --rm pipeline demo
      - name: Re-run a window and verify the checks still pass
        run: |
          docker compose run --rm pipeline run --start 2026-10-10 --end 2026-10-20
          docker compose run --rm pipeline check
      - name: Export the agent catalog
        run: |
          docker compose run --rm pipeline export-catalog --output /local/catalog.json
          python3 -c "import json; assert json.load(open('local/catalog.json'))['datasets']"
      - name: Ingest real query events in live mode
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.live.yml
        run: |
          docker compose up -d --build --wait
          docker compose exec -T trino trino --user ci.user --execute "SELECT count(*) FROM iceberg.core.fct_query"
          for attempt in $(seq 1 40); do
            received=$(docker compose exec -T trino trino --execute \
              "SELECT count(*) FROM iceberg.raw.trino_query_completed WHERE user_name = 'ci.user'")
            [ "$received" != '"0"' ] && break
            sleep 3
          done
          docker compose run --rm pipeline sync
          rows=$(docker compose exec -T trino trino --execute \
            "SELECT count(*) FROM iceberg.core.fct_query WHERE user_name = 'ci.user'")
          test "$rows" = '"1"'
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.live.yml logs --tail 200
