[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metadwh"
version = "0.1.0"
description = "Usage statistics for Iceberg tables built from Trino query events"
requires-python = ">=3.10"
dependencies = ["trino>=0.330"]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
metadwh = "metadwh.cli:main"

[tool.setuptools.packages.find]
include = ["metadwh*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
